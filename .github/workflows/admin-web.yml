name: Admin Web Console

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'admin-web/**'
      - '.github/workflows/admin-web.yml'
  workflow_dispatch:

jobs:
  build-admin-web:
    name: Build & Validate Admin Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Install dependencies
        working-directory: admin-web
        run: npm ci

      - name: Build Web Application
        working-directory: admin-web
        run: npm run build

      - name: Upload Admin Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-web-production-dist
          path: admin-web/dist/
          retention-days: 30
