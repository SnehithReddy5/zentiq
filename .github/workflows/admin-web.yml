name: Admin Web Console & Firebase Deploy

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'admin-web/**'
      - '.github/workflows/admin-web.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy to Firebase Hosting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: admin-web/package-lock.json

      - name: Install dependencies
        working-directory: admin-web
        run: npm ci

      - name: Build Web Application
        working-directory: admin-web
        run: npm run build

      - name: Upload Admin Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-web-production-dist
          path: admin-web/dist/
          retention-days: 30

      # 1. Deploy via Firebase Service Account (Recommended by Google)
      - name: Deploy to Firebase Hosting (Service Account)
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ZENTIQ_B5D40 != '' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_ZENTIQ_B5D40 }}'
          channelId: live
          projectId: zentiq-b5d40
          entryPoint: ./admin-web

      # 2. Deploy via Firebase Token Fallback
      - name: Deploy to Firebase Hosting (Token Fallback)
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ZENTIQ_B5D40 == '' && secrets.FIREBASE_TOKEN != '' }}
        working-directory: admin-web
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx firebase-tools deploy --only hosting --token "$FIREBASE_TOKEN"

      # 3. Informative notice if secrets are not yet configured in GitHub Repo
      - name: Deployment Notice if Secrets Missing
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ZENTIQ_B5D40 == '' && secrets.FIREBASE_TOKEN == '' }}
        run: |
          echo "::warning::Automated Firebase Hosting deploy requires a secret in your GitHub repository."
          echo "Please add either FIREBASE_TOKEN or FIREBASE_SERVICE_ACCOUNT_ZENTIQ_B5D40 in GitHub: Settings -> Secrets and variables -> Actions."
