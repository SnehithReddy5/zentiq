name: POS Client Apps (Android, iOS, Windows)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Choose platform to build'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - windows
          - ios
          - all
      profile:
        description: 'EAS Build Profile (for iOS)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production
  push:
    branches:
      - main
      - master
    paths:
      - 'src/**'
      - 'App.tsx'
      - 'app.json'
      - 'eas.json'
      - 'package.json'
      - 'electron/**'
      - '.github/workflows/build-apps.yml'

jobs:
  # Fast code health check that runs automatically on push without consuming cloud build credits
  typecheck:
    name: Code Health & TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate TypeScript
        run: npx tsc --noEmit

  build-android:
    name: Build Android APK (Free GitHub Actions)
    needs: typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: |
      (github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'android')) ||
      (github.event_name == 'push' && (contains(github.event.head_commit.message, '[build-android]') || contains(github.event.head_commit.message, '[build-all]') || contains(github.event.head_commit.message, '[build-apps]')))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -x lint || ./gradlew assembleDebug --no-daemon -x lint

      - name: Collect Android APK
        run: |
          mkdir -p dist-android
          find android/app/build/outputs/apk -name "*.apk" -exec cp {} dist-android/Zentiq-POS.apk \;
          ls -la dist-android/

      - name: Upload Android APK (Workflow Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: zentiq-pos-android-apk
          path: dist-android/Zentiq-POS.apk
          retention-days: 30

      # Public Release: 1-click anonymous direct download on phones/tablets without any login
      - name: Publish Android APK to Public GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: pos-android-latest
          name: Zentiq POS Android Latest (.apk)
          files: dist-android/Zentiq-POS.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # # build-ios:
  #   name: Build iOS App
  #   needs: typecheck
  #   runs-on: ubuntu-latest
  #   continue-on-error: true
  #   if: |
  #     (github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'ios')) ||
  #     (github.event_name == 'push' && (contains(github.event.head_commit.message, '[build-ios]') || contains(github.event.head_commit.message, '[build-all]') || contains(github.event.head_commit.message, '[build-apps]')))
  #   steps:
  #     - name: Checkout repository
