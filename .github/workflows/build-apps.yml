  build-windows:
    name: Build Windows Desktop (.exe)
    needs: typecheck
    runs-on: windows-latest
    permissions:
      contents: write
    if: |
      (github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'windows')) ||
      (github.event_name == 'push' && (contains(github.event.head_commit.message, '[build-win]') || contains(github.event.head_commit.message, '[build-all]') || contains(github.event.head_commit.message, '[build-apps]')))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export Web Bundle
        run: npx expo export -p web

      - name: Package Windows Installer & Store AppX
        run: |
          npm install --save-dev electron electron-builder
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));if(process.env.APPX_IDENTITY_NAME)p.build.appx.identityName=process.env.APPX_IDENTITY_NAME;if(process.env.APPX_PUBLISHER)p.build.appx.publisher=process.env.APPX_PUBLISHER;if(process.env.APPX_PUBLISHER_DISPLAY_NAME)p.build.appx.publisherDisplayName=process.env.APPX_PUBLISHER_DISPLAY_NAME;fs.writeFileSync('package.json',JSON.stringify(p,null,2));"
          npx --yes electron-builder --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          APPX_IDENTITY_NAME: ${{ secrets.APPX_IDENTITY_NAME }}
          APPX_PUBLISHER: ${{ secrets.APPX_PUBLISHER }}
          APPX_PUBLISHER_DISPLAY_NAME: ${{ secrets.APPX_PUBLISHER_DISPLAY_NAME }}

      - name: Upload Windows Packages (Internal Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-installer
          path: |
            dist-electron/*.exe
            dist-electron/*.appx
          retention-days: 30

      # Public Release: Allows 1-click anonymous direct download on client PCs without any GitHub login
      - name: Publish Windows Installer to Public GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: pos-desktop-latest
          name: Zentiq POS Desktop Latest (Windows)
          files: |
            dist-electron/*.exe
            dist-electron/*.appx
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
