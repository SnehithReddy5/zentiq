  #
  #     - name: Setup Node.js
  #       uses: actions/setup-node@v4
  #       with:
  #         node-version: 20
  #         cache: npm
  #
  #     - name: Setup EAS CLI
  #       run: npm install -g eas-cli
  #
  #     - name: Install dependencies
  #       run: npm ci
  #
  #     - name: Build iOS
  #       run: eas build --platform ios --profile ${{ inputs.profile || 'preview' }} --non-interactive
  #       env:
  #         EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  build-windows:
    name: Build Windows Desktop (.exe)
    needs: typecheck
    runs-on: windows-latest
    permissions:
      contents: write
    if: |
      (github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'windows')) ||
      (github.event_name == 'push' && (contains(github.event.head_commit.message, '[build-win]') || contains(github.event.head_commit.message, '[build-all]') || contains(github.event.head_commit.message, '[build-apps]')))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export Web Bundle
        run: npx expo export -p web

      - name: Package Windows Installer
        run: |
          npm install --save-dev electron electron-builder
          npx electron-builder --win nsis portable --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Windows Executables (Internal Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-installer
          path: dist-electron/*.exe
          retention-days: 30

      # Public Release: Allows 1-click anonymous direct download on client PCs without any GitHub login
      - name: Publish Windows Installer to Public GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: pos-desktop-latest
          name: Zentiq POS Desktop Latest (Windows)
          files: dist-electron/*.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
