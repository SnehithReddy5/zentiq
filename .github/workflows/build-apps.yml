name: POS Client Apps (Android, iOS, Windows)

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Choose platform to build'
        required: true
        default: 'android'
        type: choice
        options:
          - android
          - windows
          - ios
          - all
      profile:
        description: 'EAS Build Profile (for iOS)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production
  push:
    branches:
      - main
      - master
    paths:
      - 'src/**'
      - 'App.tsx'
      - 'app.json'
      - 'eas.json'
      - 'package.json'
      - 'electron/**'
      - '.github/workflows/build-apps.yml'

jobs:
  # Fast code health check that runs automatically on push without consuming cloud build credits
  typecheck:
    name: Code Health & TypeScript Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate TypeScript
        run: npx tsc --noEmit

  build-android:
    name: Build Android APK (Free GitHub Actions)
    needs: typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: |
      (github.event_name == 'workflow_dispatch' && (inputs.platform == 'all' || inputs.platform == 'android')) ||
      (github.event_name == 'push' && (contains(github.event.head_commit.message, '[build-android]') || contains(github.event.head_commit.message, '[build-all]') || contains(github.event.head_commit.message, '[build-apps]')))
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK Environment & Accept Licenses
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          mkdir -p /usr/local/lib/android/sdk/licenses
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > /usr/local/lib/android/sdk/licenses/android-sdk-license
          echo -e "\nd56f5187479451eabf01fb78af6dfcb131a6481e" >> /usr/local/lib/android/sdk/licenses/android-sdk-license
          echo -e "\n84831b9409646a2b8e3557b4473082f988d36febe" > /usr/local/lib/android/sdk/licenses/android-sdk-preview-license
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install dependencies
        run: npm ci

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Configure Gradle JDK Toolchain for Offline-Safe CI
        run: |
          if [ -f node_modules/@react-native/gradle-plugin/settings.gradle.kts ]; then
            sed -i '/foojay-resolver-convention/d' node_modules/@react-native/gradle-plugin/settings.gradle.kts
          fi
          printf "\norg.gradle.java.installations.auto-download=false\norg.gradle.java.installations.fromEnv=JAVA_HOME\n" >> android/gradle.properties

      - name: Build Android APK
        working-directory: android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          GRADLE_OPTS: "-Xmx4096m -XX:MaxMetaspaceSize=1024m"
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -x lint || ./gradlew assembleDebug --no-daemon -x lint

      - name: Collect & Sign Android APK
        run: |
          mkdir -p dist-android
          RAW_APK=""
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            RAW_APK="android/app/build/outputs/apk/release/app-release.apk"
          elif [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            RAW_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          elif [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            RAW_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          else
            RAW_APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          fi

          echo "Found candidate APK: $RAW_APK"
          cp "$RAW_APK" dist-android/Zentiq-POS.apk

          # Locate apksigner in Android SDK build-tools
          APKSIGNER=$(find /usr/local/lib/android/sdk/build-tools -name "apksigner" | sort -V | tail -n 1)
          echo "Using apksigner: $APKSIGNER"

          # Sign the APK with release.keystore to guarantee v1/v2/v3 signatures
          if [ -n "$APKSIGNER" ] && [ -f credentials/release.keystore ]; then
            echo "Signing APK with release.keystore..."
            $APKSIGNER sign --ks credentials/release.keystore \
              --ks-pass pass:zentiq123 \
              --ks-key-alias zentiq \
              --key-pass pass:zentiq123 \
              --out dist-android/Zentiq-POS.apk \
              dist-android/Zentiq-POS.apk

            echo "Verifying APK signature..."
            $APKSIGNER verify --verbose dist-android/Zentiq-POS.apk
          else
            echo "apksigner or keystore not found, skipping explicit sign"
          fi

          ls -lh dist-android/

      - name: Upload Android APK (Workflow Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: zentiq-pos-android-apk
          path: dist-android/Zentiq-POS.apk
          retention-days: 30

      # Public Release: 1-click anonymous direct download on phones/tablets without any login
      - name: Publish Android APK to Public GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: pos-android-latest
          name: Zentiq POS Android Latest (.apk)
          files: dist-android/Zentiq-POS.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

